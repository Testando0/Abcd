<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamFlix — Filmes Dublados</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --red: #E50914;
  --red-dark: #b20710;
  --bg: #0a0a0a;
  --surface: #141414;
  --surface2: #1e1e1e;
  --border: rgba(255,255,255,0.07);
  --text: #e5e5e5;
  --muted: #808080;
  --white: #fff;
  --sans: 'DM Sans', sans-serif;
  --display: 'Bebas Neue', sans-serif;
  --ease: cubic-bezier(0.25,0.46,0.45,0.94);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  overflow-x:hidden;
  min-height:100vh;
}

/* ── SCROLLBAR ──────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#333;border-radius:99px}

/* ── HEADER ─────────────────────────────── */
#navbar{
  position:fixed;top:0;left:0;width:100%;z-index:900;
  display:flex;align-items:center;gap:32px;
  padding:0 4%;height:64px;
  transition:background .4s var(--ease);
}
#navbar.solid{background:var(--surface)}
#navbar::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.9) 0%,transparent 100%);
  pointer-events:none;
  transition:opacity .4s;
}
#navbar.solid::before{opacity:0}

.logo{
  font-family:var(--display);
  font-size:2rem;
  color:var(--red);
  letter-spacing:2px;
  cursor:pointer;
  position:relative;z-index:1;
  flex-shrink:0;
}

.nav-links{
  display:flex;gap:20px;
  position:relative;z-index:1;
}
.nav-links a{
  font-size:.88rem;font-weight:500;
  color:rgba(255,255,255,.75);
  text-decoration:none;cursor:pointer;
  transition:color .2s;
}
.nav-links a:hover{color:#fff}

.nav-right{
  margin-left:auto;display:flex;align-items:center;gap:14px;
  position:relative;z-index:1;
}

/* search bar */
.search-wrapper{
  display:flex;align-items:center;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.2);
  border-radius:6px;
  overflow:hidden;
  transition:border-color .2s,background .2s;
}
.search-wrapper:focus-within{
  background:rgba(0,0,0,.85);
  border-color:rgba(255,255,255,.5);
}
.search-wrapper input{
  background:transparent;border:none;outline:none;
  color:#fff;font-family:var(--sans);font-size:.9rem;
  padding:7px 12px;width:220px;
}
.search-wrapper input::placeholder{color:var(--muted)}
.search-wrapper button{
  background:transparent;border:none;
  padding:7px 10px;cursor:pointer;color:var(--muted);
  font-size:1rem;transition:color .2s;
}
.search-wrapper button:hover{color:#fff}

/* ── HERO ───────────────────────────────── */
.hero{
  height:94vh;min-height:520px;
  display:flex;align-items:flex-end;
  padding:0 4% 10%;
  background-size:cover;background-position:center top;
  position:relative;
  transition:background-image .6s;
}
.hero::after{
  content:'';position:absolute;inset:0;
  background:
    linear-gradient(to right, rgba(10,10,10,.98) 0%, rgba(10,10,10,.7) 40%, transparent 70%),
    linear-gradient(to top, rgba(10,10,10,1) 0%, transparent 50%);
  pointer-events:none;
}
.hero-content{
  position:relative;z-index:2;
  max-width:540px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(229,9,20,.15);border:1px solid rgba(229,9,20,.4);
  color:var(--red);font-size:.7rem;font-weight:700;letter-spacing:2px;
  padding:4px 12px;border-radius:4px;margin-bottom:14px;
  text-transform:uppercase;
}
.hero-title{
  font-family:var(--display);
  font-size:clamp(2.8rem,6vw,5rem);
  line-height:1;
  margin-bottom:14px;
  color:#fff;
  text-shadow:0 2px 20px rgba(0,0,0,.6);
}
.hero-meta{
  display:flex;align-items:center;gap:12px;
  font-size:.82rem;font-weight:500;
  color:rgba(255,255,255,.65);
  margin-bottom:14px;
}
.hero-meta span{color:rgba(255,255,255,.9)}
.hero-meta .dot{width:3px;height:3px;background:var(--muted);border-radius:50%}
.hero-desc{
  font-size:.95rem;line-height:1.6;
  color:rgba(255,255,255,.75);
  margin-bottom:24px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 26px;border-radius:6px;border:none;
  font-family:var(--sans);font-size:.95rem;font-weight:600;
  cursor:pointer;transition:transform .2s var(--ease),filter .2s,opacity .2s;
  white-space:nowrap;
}
.btn:active{transform:scale(.97)!important}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark);transform:scale(1.03)}
.btn-secondary{background:rgba(255,255,255,.15);color:#fff;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15)}
.btn-secondary:hover{background:rgba(255,255,255,.25);transform:scale(1.03)}
.btn svg{width:18px;height:18px;flex-shrink:0}

/* ── ROWS ───────────────────────────────── */
.section{padding:0 4% 40px;margin-top:-60px;position:relative;z-index:5}
.section-title{
  font-size:1.3rem;font-weight:600;
  margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
.section-title::after{
  content:'';flex:1;height:1px;background:var(--border);
}

.cards-track{
  display:flex;gap:10px;
  overflow-x:auto;padding:8px 0 16px;
  scrollbar-width:none;
  scroll-snap-type:x mandatory;
}
.cards-track::-webkit-scrollbar{display:none}

.card{
  flex-shrink:0;
  width:clamp(130px,14vw,190px);
  scroll-snap-align:start;
  cursor:pointer;
  position:relative;
  border-radius:8px;
  overflow:hidden;
  transition:transform .3s var(--ease),box-shadow .3s;
}
.card:hover{
  transform:scale(1.08) translateY(-6px);
  box-shadow:0 20px 50px rgba(0,0,0,.7);
  z-index:10;
}
.card img{
  width:100%;aspect-ratio:2/3;object-fit:cover;
  display:block;border-radius:8px;
  background:var(--surface2);
}
.card-overlay{
  position:absolute;inset:0;
  background:linear-gradient(to top, rgba(0,0,0,.9) 0%,transparent 50%);
  opacity:0;transition:opacity .25s;
  border-radius:8px;
  display:flex;flex-direction:column;justify-content:flex-end;padding:10px;
}
.card:hover .card-overlay{opacity:1}
.card-name{font-size:.75rem;font-weight:600;line-height:1.3;color:#fff}
.card-year{font-size:.7rem;color:var(--muted);margin-top:2px}
.card-play{
  width:32px;height:32px;background:var(--red);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  margin-bottom:6px;flex-shrink:0;
}
.card-play svg{width:14px;height:14px;fill:#fff;margin-left:2px}
.card-dub-badge{
  position:absolute;top:8px;right:8px;
  background:rgba(229,9,20,.9);color:#fff;
  font-size:.6rem;font-weight:700;letter-spacing:.5px;
  padding:2px 6px;border-radius:4px;
  text-transform:uppercase;
}

/* ── SEARCH RESULTS ────────────────────── */
#search-page{
  display:none;
  padding:100px 4% 60px;
  min-height:100vh;
}
#search-page.active{display:block;animation:fadeIn .3s ease}
.search-header{
  font-family:var(--display);font-size:2rem;
  margin-bottom:8px;
  color:rgba(255,255,255,.5);
}
.search-header span{color:#fff}
.search-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:14px;margin-top:28px;
}
.search-empty{
  text-align:center;padding:80px 0;color:var(--muted);font-size:1rem;
}

/* ── MODAL / DETAIL ─────────────────────── */
.overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  z-index:1000;
  display:none;align-items:center;justify-content:center;
  backdrop-filter:blur(4px);
  padding:20px;
}
.overlay.active{display:flex;animation:fadeIn .25s ease}

.modal{
  background:#181818;
  border-radius:12px;
  width:100%;max-width:860px;
  max-height:90vh;overflow-y:auto;
  position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.9);
  scrollbar-width:thin;
}

.modal-close{
  position:absolute;top:14px;right:14px;z-index:10;
  width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15);
  color:#fff;font-size:1.2rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s;
}
.modal-close:hover{background:rgba(255,255,255,.15)}

.modal-hero{
  width:100%;aspect-ratio:16/9;
  background:#000;border-radius:12px 12px 0 0;overflow:hidden;
  position:relative;
}
.modal-hero img{width:100%;height:100%;object-fit:cover}
.modal-hero-gradient{
  position:absolute;bottom:0;left:0;right:0;height:50%;
  background:linear-gradient(to top,#181818,transparent);
}
.modal-hero iframe{width:100%;height:100%;border:none}

.modal-body{padding:24px 28px 32px}
.modal-title{
  font-family:var(--display);
  font-size:clamp(1.8rem,4vw,2.6rem);
  color:#fff;line-height:1;
  margin-bottom:12px;
}
.modal-meta{
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  margin-bottom:16px;font-size:.85rem;
}
.modal-meta .year{color:rgba(255,255,255,.9);font-weight:600}
.modal-meta .rating{
  background:rgba(39,194,48,.15);color:#27c230;
  border:1px solid rgba(39,194,48,.3);
  padding:2px 8px;border-radius:4px;font-weight:600;font-size:.78rem;
}
.modal-meta .genre-tag{
  background:rgba(255,255,255,.08);border:1px solid var(--border);
  padding:2px 10px;border-radius:20px;
  color:rgba(255,255,255,.65);font-size:.78rem;
}
.modal-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.modal-desc{
  font-size:.92rem;line-height:1.7;color:rgba(255,255,255,.7);
}

/* watch section */
.watch-area{
  margin-top:20px;
  background:var(--surface2);
  border-radius:8px;overflow:hidden;
  display:none;
}
.watch-area.visible{display:block;animation:fadeIn .3s}
.watch-area iframe{width:100%;aspect-ratio:16/9;border:none;display:block}

/* ── ANIMATIONS ─────────────────────────── */
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

.spinner{
  width:40px;height:40px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--red);border-radius:50%;
  animation:spin .7s linear infinite;
  margin:60px auto;
}

/* ── FOOTER ─────────────────────────────── */
footer{
  border-top:1px solid var(--border);
  padding:30px 4%;
  display:flex;align-items:center;justify-content:space-between;
  flex-wrap:wrap;gap:12px;
}
.footer-logo{font-family:var(--display);font-size:1.4rem;color:var(--red)}
footer p{font-size:.78rem;color:var(--muted)}

/* ── RESPONSIVE ─────────────────────────── */
@media(max-width:768px){
  .nav-links{display:none}
  .search-wrapper input{width:160px}
  .hero{height:80vh;padding-bottom:12%}
  .hero-title{font-size:2.4rem}
  .section{margin-top:-30px}
  .modal-body{padding:16px 18px 24px}
}
@media(max-width:480px){
  .search-wrapper input{width:120px}
  .card{width:clamp(100px,38vw,140px)}
}
</style>
</head>
<body>

<!-- ══ NAVBAR ══════════════════════════════════════════════ -->
<nav id="navbar">
  <div class="logo" onclick="goHome()">STREAMFLIX</div>
  <div class="nav-links">
    <a onclick="goHome()">Início</a>
    <a onclick="scrollToSection('section-action')">Ação</a>
    <a onclick="scrollToSection('section-anim')">Animação</a>
    <a onclick="scrollToSection('section-drama')">Drama</a>
    <a onclick="scrollToSection('section-terror')">Terror</a>
  </div>
  <div class="nav-right">
    <div class="search-wrapper">
      <input type="text" id="search-input" placeholder="Buscar filmes..." 
        onkeydown="if(event.key==='Enter')doSearch()" 
        oninput="if(this.value==='')goHome()">
      <button onclick="doSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<!-- ══ HOME ════════════════════════════════════════════════ -->
<div id="home-page">

  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="hero-content">
      <div class="hero-badge">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><circle cx="5" cy="5" r="5"/></svg>
        DUBLADO · HD
      </div>
      <h1 class="hero-title" id="hero-title">Carregando...</h1>
      <div class="hero-meta" id="hero-meta"></div>
      <p class="hero-desc" id="hero-desc"></p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="hero-play">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l14 9-14 9V3z"/></svg>
          Assistir Agora
        </button>
        <button class="btn btn-secondary" id="hero-info">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Mais Info
        </button>
      </div>
    </div>
  </section>

  <!-- ROWS -->
  <main>
    <div class="section" id="section-dest">
      <div class="section-title">🔥 Destaques</div>
      <div class="cards-track" id="row-dest"><div class="spinner"></div></div>
    </div>

    <div class="section" id="section-action">
      <div class="section-title">⚡ Ação & Aventura</div>
      <div class="cards-track" id="row-action"><div class="spinner"></div></div>
    </div>

    <div class="section" id="section-anim">
      <div class="section-title">🎭 Animação</div>
      <div class="cards-track" id="row-anim"><div class="spinner"></div></div>
    </div>

    <div class="section" id="section-drama">
      <div class="section-title">🎬 Drama & Romance</div>
      <div class="cards-track" id="row-drama"><div class="spinner"></div></div>
    </div>

    <div class="section" id="section-terror">
      <div class="section-title">👻 Terror & Suspense</div>
      <div class="cards-track" id="row-terror"><div class="spinner"></div></div>
    </div>
  </main>
</div>

<!-- ══ SEARCH PAGE ═════════════════════════════════════════ -->
<div id="search-page">
  <div class="search-header">Resultados para: <span id="search-term-label"></span></div>
  <div class="search-grid" id="search-grid"></div>
</div>

<!-- ══ MODAL ═══════════════════════════════════════════════ -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    
    <div class="modal-hero" id="modal-hero-area">
      <img id="modal-backdrop" src="" alt="">
      <div class="modal-hero-gradient"></div>
    </div>
    
    <div class="modal-body">
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-meta" id="modal-meta"></div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-play-btn">
          <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M5 3l14 9-14 9V3z"/></svg>
          Assistir Agora
        </button>
        <button class="btn btn-secondary" id="modal-trailer-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Ver Trailer
        </button>
      </div>
      <p class="modal-desc" id="modal-desc"></p>
      <div class="watch-area" id="watch-area">
        <iframe id="watch-iframe" allowfullscreen allow="autoplay; fullscreen" src=""></iframe>
      </div>
    </div>
  </div>
</div>

<!-- ══ FOOTER ══════════════════════════════════════════════ -->
<footer>
  <div class="footer-logo">STREAMFLIX</div>
  <p>Filmes dublados em alta qualidade · Não armazenamos conteúdo</p>
</footer>

<script>
// ─── CONFIG ────────────────────────────────────────────────
const TMDB_KEY = '8265bd1679663a7ea12ac168da84d2e8';
const TMDB = 'https://api.themoviedb.org/3';
const IMG_BASE = 'https://image.tmdb.org/t/p/';

// ─── CATÁLOGO: { tmdbId, driveId, cats[] } ─────────────────
const CATALOG = [
  // DESTAQUES / AÇÃO
  { tmdbId: 259693,  driveId: '1lomcBH_PNG6AU-OQ0GjI4If9E_VCU3Ud',    cats: ['dest','terror'] },   // Invocação do Mal 2
  { tmdbId: 324857,  driveId: '192kIa8AfSu5CXxpmkdtTotD2xG_b_3zJ',    cats: ['dest','anim'] },     // Homem-Aranha no Aranhaverso
  { tmdbId: 616037,  driveId: '1_mcgTrLIVusURa54LE6AW5RY6z8CY13o',    cats: ['dest','action'] },   // Doutor Estranho 2
  { tmdbId: 616649,  driveId: '1x_zNbuE5ElI6Rs_prfHKtqriBg9n_rw1',    cats: ['dest','action'] },   // Thor: Amor e Trovão
  { tmdbId: 299537,  driveId: '11eXUdVh8jqMdZWkknHmfSeojJdMEm1TP',    cats: ['dest','action'] },   // Capitã Marvel
  // HARRY POTTER
  { tmdbId: 671,     driveId: '1JQJ9p6SG3NKFC5wtU1Ru2nD4OnNugNzx',    cats: ['dest','drama'] },    // HP Pedra Filosofal
  { tmdbId: 674,     driveId: '1RUevpBGLLzGIkvjgtFIYd58cv-gFVom1',    cats: ['action','drama'] },  // HP Cálice de Fogo
  // AÇÃO
  { tmdbId: 333339,  driveId: '1PduN7niVV5s6NLaaLtu986rjhb1DWuL5',    cats: ['action'] },          // Ready Player One
  { tmdbId: 337339,  driveId: '0B0j7RRgVpKSGTEtGVFltamlOaVE',          cats: ['action'] },          // Velozes e Furiosos 8
  { tmdbId: 293660,  driveId: '0Bxagr-2-iSTaSzVObkpHOUFCSVU',          cats: ['action'] },          // Deadpool
  { tmdbId: 60800,   driveId: '1vwEEIqwbg0Gpim320B5ujMIMAhiwZcMU',    cats: ['action'] },          // Gigantes de Aço
  // ANIMAÇÃO
  { tmdbId: 614934,  driveId: '1jBIS4bPEC3Ti0FJ3bRrJ5naMpiKZoGHI',    cats: ['anim'] },            // Sing 2
  // DRAMA / ROMANCE
  { tmdbId: 4348,    driveId: '185blROfFpOWduXCxe-9QEBLYtSFvn9PL',    cats: ['drama'] },           // Orgulho e Preconceito
  { tmdbId: 21733,   driveId: '0B8YN5mS0RYMDdXFDUkE2ZkxJUmc',          cats: ['drama'] },           // 500 Dias com Ela
  { tmdbId: 762504,  driveId: '1U_cNOrm2mqhT6ObaCBjwR5YEH8iWvJTW',    cats: ['drama'] },           // Palmer
  // TERROR
  { tmdbId: 1072790, driveId: '12BTVXbiunxtgPAMLAvx0dV3OMqS-Rjsa',    cats: ['terror'] },          // Ballerina (2023)
];

// cache TMDB data
const movieCache = {};

// ─── FETCH TMDB ────────────────────────────────────────────
async function fetchMovie(id){
  if(movieCache[id]) return movieCache[id];
  const r = await fetch(`${TMDB}/movie/${id}?api_key=${TMDB_KEY}&language=pt-BR&append_to_response=videos`);
  const d = await r.json();
  movieCache[id] = d;
  return d;
}

// ─── BUILD CARD ─────────────────────────────────────────────
function buildCard(movie, driveId){
  const el = document.createElement('div');
  el.className = 'card';
  const poster = movie.poster_path 
    ? `${IMG_BASE}w342${movie.poster_path}` 
    : `https://via.placeholder.com/180x270/1e1e1e/666?text=Sem+Poster`;
  const year = (movie.release_date||'').slice(0,4);
  el.innerHTML = `
    <img src="${poster}" alt="${movie.title}" loading="lazy">
    <span class="card-dub-badge">DUB</span>
    <div class="card-overlay">
      <div class="card-play"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg></div>
      <div class="card-name">${movie.title}</div>
      <div class="card-year">${year}</div>
    </div>`;
  el.onclick = () => openModal(movie, driveId);
  return el;
}

// ─── POPULATE ROW ───────────────────────────────────────────
async function populateRow(rowId, catFilter){
  const container = document.getElementById(rowId);
  const movies = CATALOG.filter(m => m.cats.includes(catFilter));
  const fetches = movies.map(m => fetchMovie(m.tmdbId).then(data => ({ data, driveId: m.driveId })));
  const results = await Promise.allSettled(fetches);
  container.innerHTML = '';
  results.forEach(r => {
    if(r.status==='fulfilled' && r.value.data.title){
      container.appendChild(buildCard(r.value.data, r.value.driveId));
    }
  });
}

// ─── HERO ───────────────────────────────────────────────────
async function setupHero(){
  const featured = CATALOG[0];
  const movie = await fetchMovie(featured.tmdbId);
  const hero = document.getElementById('hero');
  hero.style.backgroundImage = `url(${IMG_BASE}original${movie.backdrop_path})`;
  document.getElementById('hero-title').textContent = movie.title;
  document.getElementById('hero-desc').textContent = movie.overview;
  const year = (movie.release_date||'').slice(0,4);
  const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '';
  const genres = (movie.genres||[]).slice(0,2).map(g=>g.name).join(' · ');
  document.getElementById('hero-meta').innerHTML = `
    <span>${year}</span><div class="dot"></div>
    <span>⭐ ${rating}</span><div class="dot"></div>
    <span>${genres}</span>`;
  document.getElementById('hero-play').onclick = () => openModal(movie, featured.driveId, true);
  document.getElementById('hero-info').onclick = () => openModal(movie, featured.driveId, false);
}

// ─── MODAL ──────────────────────────────────────────────────
let currentDriveId = null;
let currentTrailerKey = null;

async function openModal(movie, driveId, autoPlay=false){
  currentDriveId = driveId;
  const overlay = document.getElementById('overlay');
  const watchArea = document.getElementById('watch-area');
  watchArea.classList.remove('visible');
  document.getElementById('watch-iframe').src = '';
  
  // backdrop
  const bdPath = movie.backdrop_path || movie.poster_path;
  document.getElementById('modal-backdrop').src = `${IMG_BASE}w1280${bdPath}`;
  document.getElementById('modal-title').textContent = movie.title;
  document.getElementById('modal-desc').textContent = movie.overview || 'Descrição não disponível.';

  // meta
  const year = (movie.release_date||'').slice(0,4);
  const rating = movie.vote_average ? movie.vote_average.toFixed(1) : '–';
  const genres = (movie.genres||[]).map(g=>`<span class="genre-tag">${g.name}</span>`).join('');
  document.getElementById('modal-meta').innerHTML = `
    <span class="year">${year}</span>
    <span class="rating">⭐ ${rating}</span>
    ${genres}`;

  // trailer key
  let fullMovie = movie;
  if(!movie.videos){
    fullMovie = await fetchMovie(movie.id);
  }
  const trailer = (fullMovie.videos?.results||[]).find(v=>v.type==='Trailer'&&v.site==='YouTube');
  currentTrailerKey = trailer?.key || null;

  // buttons
  document.getElementById('modal-play-btn').onclick = () => playDrive();
  document.getElementById('modal-trailer-btn').onclick = () => playTrailer();
  document.getElementById('modal-trailer-btn').style.display = currentTrailerKey ? 'inline-flex' : 'none';

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  if(autoPlay) playDrive();
}

function playDrive(){
  const area = document.getElementById('watch-area');
  const iframe = document.getElementById('watch-iframe');
  iframe.src = `https://drive.google.com/file/d/${currentDriveId}/preview`;
  area.classList.add('visible');
  area.scrollIntoView({behavior:'smooth',block:'center'});
}

function playTrailer(){
  if(!currentTrailerKey) return;
  const area = document.getElementById('watch-area');
  const iframe = document.getElementById('watch-iframe');
  iframe.src = `https://www.youtube.com/embed/${currentTrailerKey}?autoplay=1`;
  area.classList.add('visible');
  area.scrollIntoView({behavior:'smooth',block:'center'});
}

function closeModal(e){
  if(e && e.target !== document.getElementById('overlay')) return;
  document.getElementById('overlay').classList.remove('active');
  document.getElementById('watch-iframe').src = '';
  document.getElementById('watch-area').classList.remove('visible');
  document.body.style.overflow = '';
}

// ─── SEARCH ─────────────────────────────────────────────────
async function doSearch(){
  const q = document.getElementById('search-input').value.trim();
  if(!q) return;
  document.getElementById('home-page').style.display = 'none';
  const sp = document.getElementById('search-page');
  sp.classList.add('active');
  document.getElementById('search-term-label').textContent = `"${q}"`;
  const grid = document.getElementById('search-grid');
  grid.innerHTML = '<div class="spinner"></div>';

  // search TMDB
  const r = await fetch(`${TMDB}/search/movie?api_key=${TMDB_KEY}&language=pt-BR&query=${encodeURIComponent(q)}`);
  const data = await r.json();
  grid.innerHTML = '';

  if(!data.results?.length){
    grid.innerHTML = `<div class="search-empty" style="grid-column:1/-1">Nenhum resultado encontrado para "${q}"</div>`;
    return;
  }

  data.results.forEach(movie => {
    // check if we have a drive link
    const found = CATALOG.find(c => c.tmdbId === movie.id);
    const driveId = found?.driveId || null;
    const el = document.createElement('div');
    el.className = 'card';
    el.style.width = '100%';
    const poster = movie.poster_path
      ? `${IMG_BASE}w342${movie.poster_path}`
      : `https://via.placeholder.com/180x270/1e1e1e/666?text=Sem+Poster`;
    const year = (movie.release_date||'').slice(0,4);
    el.innerHTML = `
      <img src="${poster}" alt="${movie.title}" loading="lazy">
      ${driveId ? '<span class="card-dub-badge">DUB</span>' : ''}
      <div class="card-overlay">
        <div class="card-play"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-14 9V3z"/></svg></div>
        <div class="card-name">${movie.title}</div>
        <div class="card-year">${year}</div>
      </div>`;
    el.onclick = () => openModal(movie, driveId, false);
    grid.appendChild(el);
  });
}

function goHome(){
  document.getElementById('search-input').value = '';
  document.getElementById('home-page').style.display = 'block';
  document.getElementById('search-page').classList.remove('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

function scrollToSection(id){
  const el = document.getElementById(id);
  if(el) el.scrollIntoView({behavior:'smooth'});
}

// ─── NAVBAR SCROLL ──────────────────────────────────────────
window.addEventListener('scroll',()=>{
  document.getElementById('navbar').classList.toggle('solid', window.scrollY > 60);
});

// ─── ESC KEY ────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    closeModal();
  }
});

// ─── INIT ───────────────────────────────────────────────────
(async()=>{
  await setupHero();
  await Promise.all([
    populateRow('row-dest',   'dest'),
    populateRow('row-action', 'action'),
    populateRow('row-anim',   'anim'),
    populateRow('row-drama',  'drama'),
    populateRow('row-terror', 'terror'),
  ]);
})();
</script>
