<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invocação do Mal 2 - Assista Agora</title>
    <style>
        /* Estilos base (Estilo Netflix) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #141414;
            color: #fff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Navbar simples */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
        }

        header h1 {
            color: #E50914; /* Vermelho Netflix */
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Hero Section (Capa do Filme) */
        .hero {
            position: relative;
            height: 100vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            padding: 0 50px;
        }

        /* Gradiente escuro para dar contraste ao texto */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, #141414 10%, transparent 70%),
                        linear-gradient(to top, #141414 5%, transparent 40%);
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 600px;
        }

        .movie-title {
            font-size: 4rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .movie-overview {
            font-size: 1.2rem;
            line-height: 1.5;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .play-btn {
            background-color: #fff;
            color: #000;
            border: none;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            transition: background-color 0.2s ease;
        }

        .play-btn:hover {
            background-color: #e6e6e6;
        }

        .play-btn svg {
            margin-right: 10px;
            width: 24px;
            height: 24px;
        }

        /* Modal do Player */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 3rem;
            cursor: pointer;
            z-index: 10000;
        }

        .close-btn:hover {
            color: #E50914;
        }

        .video-container {
            width: 90%;
            height: 90%;
            max-width: 1200px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CineFlix</h1>
    </header>

    <main class="hero" id="hero-section">
        <div class="hero-content">
            <h2 class="movie-title" id="title">Carregando...</h2>
            <p class="movie-overview" id="overview">Aguarde, buscando informações no TMDB...</p>
            <button class="play-btn" onclick="openPlayer()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                Assistir
            </button>
        </div>
    </main>

    <div class="player-modal" id="playerModal">
        <button class="close-btn" onclick="closePlayer()">&times;</button>
        <div class="video-container">
            <iframe src="https://drive.google.com/file/d/1lomcBH_PNG6AU-OQ0GjI4If9E_VCU3Ud/preview" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES DA API TMDB
        const TMDB_API_KEY = 'SUA_CHAVE_API_AQUI'; // <--- COLOQUE SUA CHAVE AQUI
        const MOVIE_ID = '259693'; // ID do filme Invocação do Mal 2 no TMDB

        // Função para buscar dados do filme
        async function fetchMovieData() {
            try {
                // Requisição à API do TMDB (em pt-BR para puxar sinopse e título traduzidos)
                const url = `https://api.themoviedb.org/3/movie/${MOVIE_ID}?api_key=${TMDB_API_KEY}&language=pt-BR`;
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error("Erro ao buscar dados do TMDB. Verifique sua chave de API.");
                }

                const data = await response.json();

                // Atualizar DOM com os dados
                document.getElementById('title').textContent = data.title;
                document.getElementById('overview').textContent = data.overview;
                
                // Construir URL da imagem de fundo (backdrop)
                const backdropUrl = `https://image.tmdb.org/t/p/original${data.backdrop_path}`;
                document.getElementById('hero-section').style.backgroundImage = `url('${backdropUrl}')`;

            } catch (error) {
                console.error(error);
                // Fallback caso a API falhe ou não tenha a chave configurada
                document.getElementById('title').textContent = "Invocação do Mal 2";
                document.getElementById('overview').textContent = "Ed e Lorraine Warren viajam para o norte de Londres para ajudar uma mãe solteira criando quatro filhos sozinha em uma casa assombrada por espíritos malignos.";
            }
        }

        // Funções para controlar o Player
        function openPlayer() {
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('playerModal').style.display = 'none';
        }

        // Carregar os dados ao iniciar a página
        window.onload = fetchMovieData;
    </script>
</body>
</html>
