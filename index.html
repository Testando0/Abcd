<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlix BR \u2014 Filmes e S\u00e9ries Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090e;--surface:#0d1018;--card:#111520;--border:#1c2233;
  --accent:#e8b44b;--accent2:#c9404a;--text:#eef0f8;--muted:#5c677d;
  --tag:#151c2e;--r:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}

/* \u2500\u2500 SCROLLBAR \u2500\u2500 */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

/* \u2500\u2500 HEADER \u2500\u2500 */
header{
  position:sticky;top:0;z-index:200;
  height:62px;padding:0 28px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  background:rgba(7,9,14,.88);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
}
.logo{
  font-family:'Syne',sans-serif;font-weight:800;font-size:20px;
  cursor:pointer;display:flex;align-items:center;gap:7px;white-space:nowrap;
  letter-spacing:-.5px;
}
.logo em{color:var(--accent);font-style:normal;}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);
  animation:blink 2s ease-in-out infinite;flex-shrink:0;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

nav{display:flex;gap:2px;}
nav button{
  background:none;border:none;color:var(--muted);
  font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;
  padding:7px 14px;border-radius:8px;cursor:pointer;transition:.18s;
  white-space:nowrap;
}
nav button:hover{background:var(--tag);color:var(--text);}
nav button.active{background:var(--tag);color:var(--accent);font-weight:600;}

.search-wrap{
  display:flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:7px 13px;transition:.18s;
  min-width:200px;
}
.search-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,180,75,.1);}
.search-wrap svg{color:var(--muted);flex-shrink:0;}
.search-wrap input{
  background:none;border:none;outline:none;
  color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;width:100%;
}
.search-wrap input::placeholder{color:var(--muted);}

/* \u2500\u2500 HERO \u2500\u2500 */
#hero{position:relative;height:500px;overflow:hidden;}
.hero-bg{
  position:absolute;inset:0;
  background-size:cover;background-position:center 20%;
  transition:opacity .9s ease;
}
.hero-fade{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,rgba(7,9,14,.97) 0%,rgba(7,9,14,.65) 55%,rgba(7,9,14,.05) 100%),
    linear-gradient(0deg,rgba(7,9,14,1) 0%,transparent 45%);
}
.hero-body{
  position:relative;z-index:2;
  max-width:550px;height:100%;
  padding:0 44px;display:flex;flex-direction:column;justify-content:center;gap:14px;
}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;width:fit-content;
  background:rgba(232,180,75,.1);border:1px solid rgba(232,180,75,.28);
  color:var(--accent);font-size:11px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;padding:4px 11px;border-radius:100px;
}
.hero-title{
  font-family:'Syne',sans-serif;font-size:38px;font-weight:800;
  line-height:1.08;letter-spacing:-1px;
}
.hero-meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.hero-meta .stars{color:var(--accent);font-weight:700;display:flex;align-items:center;gap:3px;}
.hero-dot{width:3px;height:3px;border-radius:50%;background:var(--border);}
.hero-desc{
  font-size:13.5px;color:#7a86a1;line-height:1.72;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.hero-btns{display:flex;gap:10px;margin-top:4px;}
.btn-play{
  display:flex;align-items:center;gap:8px;
  background:var(--accent);color:#07090e;border:none;
  padding:11px 22px;border-radius:10px;font-family:'DM Sans',sans-serif;
  font-size:13.5px;font-weight:700;cursor:pointer;transition:.2s;
}
.btn-play:hover{background:#f0c45e;transform:translateY(-1px);box-shadow:0 8px 24px rgba(232,180,75,.35);}
.btn-info{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.07);color:var(--text);
  border:1px solid var(--border);padding:11px 22px;border-radius:10px;
  font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;transition:.2s;
  backdrop-filter:blur(8px);
}
.btn-info:hover{background:rgba(255,255,255,.12);}
.hero-dots{
  display:flex;gap:6px;margin-top:8px;
}
.hdot{
  width:6px;height:6px;border-radius:50%;
  background:rgba(255,255,255,.2);cursor:pointer;transition:.2s;
}
.hdot.on{background:var(--accent);width:20px;border-radius:3px;}

/* \u2500\u2500 SECTIONS \u2500\u2500 */
.section{max-width:1380px;margin:0 auto 48px;padding:0 28px;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.sec-title{
  font-family:'Syne',sans-serif;font-size:18px;font-weight:700;
  display:flex;align-items:center;gap:9px;
}
.sec-title::before{content:'';width:4px;height:18px;background:var(--accent);border-radius:2px;}
.see-all{
  background:none;border:none;color:var(--accent);
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;
  display:flex;align-items:center;gap:4px;transition:.18s;
}
.see-all:hover{opacity:.7;}

/* \u2500\u2500 PILLS \u2500\u2500 */
.pills{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:22px;}
.pill{
  padding:5px 15px;border-radius:100px;
  background:var(--tag);border:1px solid var(--border);
  color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;
  transition:.18s;font-family:'DM Sans',sans-serif;
}
.pill:hover{border-color:var(--accent);color:var(--text);}
.pill.on{background:var(--accent);color:#07090e;border-color:var(--accent);font-weight:700;}

/* \u2500\u2500 GRID \u2500\u2500 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:14px;}

/* \u2500\u2500 CARD \u2500\u2500 */
.card{
  cursor:pointer;border-radius:var(--r);overflow:hidden;
  background:var(--card);border:1px solid var(--border);
  transition:transform .22s,box-shadow .22s,border-color .22s;
  position:relative;
}
.card:hover{
  transform:translateY(-5px) scale(1.02);
  box-shadow:0 20px 45px rgba(0,0,0,.55),0 0 30px rgba(232,180,75,.1);
  border-color:rgba(232,180,75,.35);
}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--surface);}
.card-ov{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(7,9,14,.96) 0%,transparent 60%);
  display:flex;align-items:flex-end;justify-content:center;
  padding:14px;opacity:0;transition:opacity .22s;
}
.card:hover .card-ov{opacity:1;}
.picon{
  background:var(--accent);color:#07090e;border:none;border-radius:50%;
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 18px rgba(232,180,75,.4);transition:.2s;
}
.picon:hover{transform:scale(1.1);}
.card-rating{
  position:absolute;top:8px;right:8px;
  background:rgba(7,9,14,.82);backdrop-filter:blur(6px);
  border:1px solid rgba(232,180,75,.3);color:var(--accent);
  font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:5px;
  display:flex;align-items:center;gap:3px;
}
.card-type-badge{
  position:absolute;top:8px;left:8px;
  background:rgba(201,64,74,.85);color:#fff;
  font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:4px;
  letter-spacing:.5px;
}
.card-bot{padding:10px 11px;}
.card-name{
  font-family:'Syne',sans-serif;font-size:12.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;
}
.card-year{font-size:11.5px;color:var(--muted);}

/* \u2500\u2500 SKELETON \u2500\u2500 */
.sk{border
