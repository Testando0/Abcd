<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Streaming</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-black: #141414;
            --text-white: #FFFFFF;
            --gray: #808080;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* Header */
        header {
            padding: 15px 4%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
            position: fixed;
            width: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
        }

        header h1 {
            color: var(--netflix-red);
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Player Container (Hero Area) */
        .main-container {
            padding-top: 70px;
            width: 100%;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* Proporção 16:9 */
            background: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Movie Info */
        .info-section {
            padding: 20px 4%;
            background: linear-gradient(to bottom, #000, var(--bg-black));
        }

        .movie-title {
            font-size: 2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .metadata {
            display: flex;
            gap: 15px;
            color: #46d369; /* Cor de "relevância" da Netflix */
            font-weight: bold;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .metadata span.year { color: var(--gray); }
        .metadata span.rating { border: 1px solid var(--gray); padding: 0 5px; color: var(--text-white); }

        .synopsis {
            font-size: 1rem;
            line-height: 1.4;
            max-width: 800px;
            color: #d2d2d2;
        }

        /* Filas de Imagens (Rows) */
        .row {
            padding: 20px 0 20px 4%;
        }

        .row-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .posters-container {
            display: flex;
            overflow-x: scroll;
            gap: 10px;
            padding-bottom: 10px;
            scrollbar-width: none; /* Firefox */
        }

        .posters-container::-webkit-scrollbar {
            display: none; /* Chrome/Safari */
        }

        .poster-item {
            min-width: 160px;
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .poster-item:hover {
            transform: scale(1.05);
        }

        .poster-item img {
            width: 100%;
            border-radius: 4px;
            display: block;
        }

        /* Responsividade Celular */
        @media (max-width: 768px) {
            header h1 { font-size: 1.4rem; }
            .movie-title { font-size: 1.5rem; }
            .synopsis { font-size: 0.9rem; }
            .poster-item { min-width: 110px; }
            .row-title { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Teste</h1>
    </header>

    <main class="main-container">
        <div class="video-wrapper">
            <iframe src="https://drive.google.com/file/d/1lomcBH_PNG6AU-OQ0GjI4If9E_VCU3Ud/preview" allowfullscreen></iframe>
        </div>

        <section class="info-section">
            <div class="metadata">
                <span>98% relevante</span>
                <span class="year">2016</span>
                <span class="rating">14</span>
                <span>2h 14min</span>
            </div>
            <h2 class="movie-title" id="main-title">Invocação do Mal 2</h2>
            <p class="synopsis" id="main-synopsis">Carregando sinopse...</p>
        </section>

        <section class="row">
            <h3 class="row-title">Mais títulos como este</h3>
            <div class="posters-container" id="recommendations-row">
                </div>
        </section>

        <section class="row">
            <h3 class="row-title">Em alta</h3>
            <div class="posters-container" id="trending-row">
                </div>
        </section>
    </main>

    <script>
        const TMDB_API_KEY = 'SUA_CHAVE_API_AQUI'; // Substitua pela sua chave
        const MAIN_MOVIE_ID = '259693'; // Invocação do Mal 2

        async function loadContent() {
            try {
                // 1. Carregar Detalhes do Filme Principal
                const movieUrl = `https://api.themoviedb.org/3/movie/${MAIN_MOVIE_ID}?api_key=${TMDB_API_KEY}&language=pt-BR`;
                const movieRes = await fetch(movieUrl);
                const movieData = await movieRes.json();
                
                document.getElementById('main-title').textContent = movieData.title;
                document.getElementById('main-synopsis').textContent = movieData.overview;

                // 2. Carregar Recomendações (Imagens)
                const recUrl = `https://api.themoviedb.org/3/movie/${MAIN_MOVIE_ID}/recommendations?api_key=${TMDB_API_KEY}&language=pt-BR`;
                const recRes = await fetch(recUrl);
                const recData = await recRes.json();
                fillRow('recommendations-row', recData.results);

                // 3. Carregar Filmes em Alta (Imagens)
                const trendUrl = `https://api.themoviedb.org/3/trending/movie/week?api_key=${TMDB_API_KEY}&language=pt-BR`;
                const trendRes = await fetch(trendUrl);
                const trendData = await trendRes.json();
                fillRow('trending-row', trendData.results);

            } catch (error) {
                console.error("Erro ao carregar dados do TMDB:", error);
            }
        }

        function fillRow(elementId, movies) {
            const container = document.getElementById(elementId);
            container.innerHTML = ''; // Limpa o "Carregando"

            movies.forEach(movie => {
                if (movie.poster_path) {
                    const div = document.createElement('div');
                    div.className = 'poster-item';
                    div.innerHTML = `
                        <img src="https://image.tmdb.org/t/p/w342${movie.poster_path}" alt="${movie.title}">
                    `;
                    container.appendChild(div);
                }
            });
        }

        window.onload = loadContent;
    </script>
</body>
</html>
