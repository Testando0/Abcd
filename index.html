<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Streaming</title>
    <style>
        :root {
            --netflix-red: #E50914;
            --bg-black: #141414;
            --text-white: #FFFFFF;
            --gray: #a3a3a3;
            --transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-black);
            color: var(--text-white);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        /* HEADER */
        header {
            position: fixed;
            top: 0; width: 100%;
            padding: 20px 4%;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            display: flex;
            align-items: center;
            transition: background 0.3s;
        }

        header.scrolled { background: var(--bg-black); }

        header h1 {
            color: var(--netflix-red);
            font-size: 1.8rem;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* SEÇÕES PRINCIPAIS */
        .page { display: none; min-height: 100vh; }
        .page.active { display: block; animation: fadeIn 0.5s ease; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* HOME - HERO */
        .hero {
            height: 80vh;
            display: flex;
            align-items: center;
            padding: 0 4%;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .hero::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to right, var(--bg-black) 10%, transparent 80%),
                        linear-gradient(to top, var(--bg-black), transparent 40%);
        }

        .hero-content { position: relative; z-index: 2; max-width: 600px; }
        .hero-title { font-size: 3.5rem; margin-bottom: 15px; }
        .hero-desc { font-size: 1.1rem; line-height: 1.4; margin-bottom: 20px; color: #e5e5e5; }

        .btn {
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            margin-right: 10px;
            transition: var(--transition);
        }

        .btn-white { background: #fff; color: #000; }
        .btn-gray { background: rgba(109, 109, 110, 0.7); color: #fff; }
        .btn:hover { opacity: 0.8; transform: scale(1.05); }

        /* LISTAS DE FILMES */
        .row { padding: 20px 4%; }
        .row-title { font-size: 1.4rem; margin-bottom: 10px; }
        .posters {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 15px 0;
            scrollbar-width: none;
        }
        .posters::-webkit-scrollbar { display: none; }

        .item {
            min-width: 180px;
            cursor: pointer;
            transition: var(--transition);
        }

        .item:hover { transform: scale(1.1); z-index: 5; }
        .item img { width: 100%; border-radius: 4px; }

        /* TELA DE DETALHES */
        .details-container {
            padding: 100px 4% 40px;
            background-size: cover;
            background-position: center top;
            min-height: 100vh;
            position: relative;
        }

        .details-container::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
        }

        .details-content { position: relative; z-index: 10; display: flex; flex-direction: column; gap: 30px; }
        
        .trailer-box {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 16/9;
            background: #000;
            margin: 0 auto;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        .trailer-box iframe { width: 100%; height: 100%; border: none; }

        /* MOBILE ADAPTATION */
        @media (max-width: 768px) {
            .hero-title { font-size: 2rem; }
            .item { min-width: 130px; }
            .details-container { padding-top: 80px; }
        }
    </style>
</head>
<body>

    <header id="navbar">
        <h1 onclick="showPage('home')">Teste</h1>
    </header>

    <div id="home" class="page active">
        <section id="hero" class="hero">
            <div class="hero-content">
                <h2 class="hero-title" id="h-title">...</h2>
                <p class="hero-desc" id="h-desc">...</p>
                <button class="btn btn-white" id="h-play">Assistir</button>
                <button class="btn btn-gray" id="h-info">Mais Informações</button>
            </div>
        </section>

        <div class="row">
            <h3 class="row-title">Recomendados</h3>
            <div class="posters" id="row-rec"></div>
        </div>

        <div class="row">
            <h3 class="row-title">Em Alta</h3>
            <div class="posters" id="row-trend"></div>
        </div>
    </div>

    <div id="details" class="page">
        <div class="details-container" id="det-bg">
            <div class="details-content">
                <div style="max-width: 800px;">
                    <h2 class="hero-title" id="det-title">Título</h2>
                    <p class="hero-desc" id="det-desc">Descrição do filme aparecerá aqui...</p>
                    <button class="btn btn-white" id="det-play-main">ASSISTIR AGORA</button>
                    <button class="btn btn-gray" onclick="showPage('home')">Voltar</button>
                </div>
                
                <div class="trailer-box" id="media-container">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÕES
        const TMDB_API_KEY = 'SUA_CHAVE_API_AQUI'; 
        const DRIVE_LINK = "https://drive.google.com/file/d/1lomcBH_PNG6AU-OQ0GjI4If9E_VCU3Ud/preview";
        const MAIN_ID = '259693'; // ID Invocação do Mal 2

        // NAVEGAÇÃO
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0,0);
        }

        // BUSCAR DADOS
        async function init() {
            if(TMDB_API_KEY === 'SUA_CHAVE_API_AQUI') {
                alert("Por favor, insira sua chave da API do TMDB no código.");
                return;
            }

            try {
                // Hero principal
                const res = await fetch(`https://api.themoviedb.org/3/movie/${MAIN_ID}?api_key=${TMDB_API_KEY}&language=pt-BR`);
                const data = await res.json();
                
                document.getElementById('h-title').innerText = data.title;
                document.getElementById('h-desc').innerText = data.overview;
                document.getElementById('hero').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${data.backdrop_path})`;
                
                document.getElementById('h-play').onclick = () => openDetails(MAIN_ID, true);
                document.getElementById('h-info').onclick = () => openDetails(MAIN_ID, false);

                // Carregar Fileiras
                loadRow(`https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_API_KEY}&language=pt-BR`, 'row-trend');
                loadRow(`https://api.themoviedb.org/3/movie/${MAIN_ID}/recommendations?api_key=${TMDB_API_KEY}&language=pt-BR`, 'row-rec');

            } catch (e) { console.error("Erro:", e); }
        }

        async function loadRow(url, elementId) {
            const res = await fetch(url);
            const data = await res.json();
            const container = document.getElementById(elementId);
            
            data.results.forEach(movie => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<img src="https://image.tmdb.org/t/p/w342${movie.poster_path}">`;
                div.onclick = () => openDetails(movie.id, false);
                container.appendChild(div);
            });
        }

        async function openDetails(id, autoPlay) {
            const res = await fetch(`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=pt-BR&append_to_response=videos`);
            const movie = await res.json();

            document.getElementById('det-title').innerText = movie.title;
            document.getElementById('det-desc').innerText = movie.overview;
            document.getElementById('det-bg').style.backgroundImage = `url(https://image.tmdb.org/t/p/original${movie.backdrop_path})`;
            
            const container = document.getElementById('media-container');
            
            // Se for o ID do Invocação do Mal, o botão de "Assistir" usa o Drive.
            // Para outros, mostramos o Trailer do YouTube como demonstração funcional.
            
            const watchAction = () => {
                container.innerHTML = `<iframe src="${DRIVE_LINK}" allow="autoplay" allowfullscreen></iframe>`;
            };

            document.getElementById('det-play-main').onclick = watchAction;

            if(autoPlay) {
                watchAction();
            } else {
                // Carrega Trailer
                const trailer = movie.videos.results.find(v => v.type === 'Trailer');
                if(trailer) {
                    container.innerHTML = `<iframe src="https://www.youtube.com/embed/${trailer.key}?autoplay=0" allowfullscreen></iframe>`;
                } else {
                    container.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%;">Trailer não disponível</div>`;
                }
            }

            showPage('details');
        }

        // Efeito de scroll na Navbar
        window.onscroll = () => {
            if (window.scrollY > 50) document.getElementById('navbar').classList.add('scrolled');
            else document.getElementById('navbar').classList.remove('scrolled');
        };

        init();
    </script>
</body>
</html>
